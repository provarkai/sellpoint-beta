<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password - SellersPoint</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="single-page premium-page">
  <main class="premium-main premium-auth">
    <div class="premium-hero">
      <span class="premium-kicker">SellersPoint</span>
      <h1>Reset your password</h1>
      <p class="premium-sub">Enter your account email and we'll send you a reset link.</p>
    </div>
    <form id="forgotForm">
      <label>Email<input id="email" type="email" required></label>
      <button>Send Reset Link</button>
      <p class="meta"><a href="login.html">Back to log in</a></p>
    </form>
  </main>
  <div id="toast"></div>
  <script type="module" src="supabase-init.js"></script>
  <script defer src="forgot-password.js"></script>
</body>
</html>
