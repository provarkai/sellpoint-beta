<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in - SellersPoint</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="single-page premium-page">
  <main class="premium-main premium-auth">
    <div class="premium-hero">
      <span class="premium-kicker">SellersPoint</span>
      <h1>Log in to your account</h1>
      <p class="premium-sub">Manage your products, orders, and customers.</p>
    </div>
    <form id="loginForm">
      <label>Email<input id="email" type="email" required></label>
      <label>Password<input id="password" type="password" required></label>
      <button>Log In</button>
      <p class="meta">No account yet? <a href="signup.html">Sign up</a> - <a href="forgot-password.html">Forgot password?</a></p>
    </form>
    <p class="meta premium-hint">Just need a quick receipt? Try the <a href="receipt.html">free Receipt Generator</a> - no full setup required.</p>
  </main>
  <div id="toast"></div>
  <script type="module" src="supabase-init.js"></script>
  <script defer src="auth-shared.js"></script>
  <script defer src="login.js"></script>
</body>
</html>
