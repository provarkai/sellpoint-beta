<!doctype html>
<html lang="en">
<head>
  <script src="/branding.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/assets/branding/logo/icon%202.png">
  <title>Set up your business - SellersPoint</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="single-page premium-page">
  <main class="premium-main premium-auth wizard-main">
    <div class="premium-topbar"><img src="/assets/branding/logo/logo_1_main-real.png" alt="SellersPoint" class="premium-logo"></div>
    <div class="premium-hero">
      <span class="premium-kicker" id="wizardStepLabel">Step 1 of 4</span>
      <h1 id="wizardTitle">Let's set up your business</h1>
      <p class="premium-sub" id="wizardSub">Two minutes now saves confusion later - every step can be changed in Settings.</p>
    </div>
    <div class="wizard-progress"><div id="wizardProgressBar" class="wizard-progress-bar"></div></div>

    <form id="stepProfile" class="wizard-step">
      <label>Business name<input id="oBusinessName" placeholder="Your Business"></label>
      <label>Phone number<input id="oBusinessPhone" placeholder="2348012345678"></label>
      <label>Business logo<input id="oLogo" type="file" accept="image/*"></label>
      <label>Address<input id="oAddress" placeholder="123 Market Street, Lagos"></label>
      <label>Currency <span class="meta">(display only - can be changed anytime in Settings)</span><select id="oCurrency"><option value="NGN" selected>NGN - Nigerian Naira (₦)</option><option value="GHS">GHS - Ghanaian Cedi (GH₵)</option><option value="KES">KES - Kenyan Shilling (KSh)</option><option value="ZAR">ZAR - South African Rand (R)</option><option value="EGP">EGP - Egyptian Pound (E£)</option><option value="XOF">XOF - West African CFA Franc (CFA)</option><option value="UGX">UGX - Ugandan Shilling (USh)</option><option value="TZS">TZS - Tanzanian Shilling (TSh)</option><option value="RWF">RWF - Rwandan Franc (RF)</option><option value="USD">USD - US Dollar ($)</option></select></label>
      <label>Payment details <span class="meta">(shown on invoices and sent to customers)</span><textarea id="oPayment" rows="4" placeholder="Bank: Example Bank
Account: 1234567890
Name: Your Business"></textarea></label>
      <p class="actions"><button type="button" class="wizard-skip" data-skip="stepProfile">Skip</button><button>Continue</button></p>
    </form>

    <form id="stepProduct" class="wizard-step" style="display:none">
      <label>What do you sell? <span class="meta">(product, service, or digital item)</span><input id="wProductName" placeholder="e.g. Ankara Fabric"></label>
      <label>Price<input id="wProductPrice" type="number" min="0" placeholder="5000"></label>
      <label>Stock / slots<input id="wProductStock" type="number" min="0" value="10"></label>
      <p class="actions"><button type="button" class="wizard-back" data-back="stepProduct">Back</button><button type="button" class="wizard-skip" data-skip="stepProduct">Skip</button><button>Add Product</button></p>
    </form>

    <form id="stepCustomer" class="wizard-step" style="display:none">
      <label>A customer's name<input id="wCustomerName" placeholder="e.g. Amina Bello"></label>
      <label>Phone<input id="wCustomerPhone" placeholder="2348012345678"></label>
      <p class="actions"><button type="button" class="wizard-back" data-back="stepCustomer">Back</button><button type="button" class="wizard-skip" data-skip="stepCustomer">Skip</button><button>Add Customer</button></p>
    </form>

    <form id="stepOrder" class="wizard-step" style="display:none">
      <p class="meta" id="orderStepNote">Create your first order to see how it flows through the app.</p>
      <p class="actions"><button type="button" class="wizard-back" data-back="stepOrder">Back</button><button type="button" class="wizard-skip" data-skip="stepOrder">Skip</button><button id="createOrderBtn">Create First Order</button></p>
    </form>

    <div id="stepDone" class="wizard-step" style="display:none">
      <div id="confettiBurst" class="confetti-burst"></div>
      <h2>Congratulations! 🎉</h2>
      <p class="meta">Your business is ready. Taking you to your dashboard now...</p>
      <p class="actions"><a class="button-link" href="app.html">Continue to Dashboard</a></p>
    </div>
  </main>
  <div id="toast"></div>
  <script type="module" src="supabase-init.js"></script>
  <script defer src="auth-shared.js"></script>
  <script defer src="onboarding.js"></script>
</body>
</html>
