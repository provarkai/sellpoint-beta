<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SellersPoint Upgrade</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="single-page premium-page">
  <main class="premium-main">
    <a class="button-link premium-back" href="index.html">Back to App</a>
    <div class="premium-hero">
      <span class="premium-kicker">SellersPoint Upgrade</span>
      <h1>Unlock what your business is ready for.</h1>
      <p class="premium-sub">Instant activation with Paystack. Cancel any time. No manual email step - you're already signed in.</p>
    </div>
    <div id="verifyStatus" class="invoice" style="display:none"></div>
    <p class="actions cycle-toggle premium-toggle"><button id="cycleMonthly" class="active">Monthly</button><button id="cycleYearly">Yearly - 2 months free</button></p>
    <p class="meta premium-hint" id="cycleHint"></p>
    <section id="planCards" class="premium-plans"></section>
  </main>
  <div id="toast"></div>
  <script type="module" src="supabase-init.js"></script>
  <script defer src="auth-shared.js"></script>
  <script defer src="upgrade.js"></script>
</body>
</html>
