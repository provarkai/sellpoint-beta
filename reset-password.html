<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set new password - SellersPoint</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="single-page premium-page">
  <main class="premium-main premium-auth">
    <div class="premium-hero">
      <span class="premium-kicker">SellersPoint</span>
      <h1>Set a new password</h1>
      <p class="premium-sub" id="pageNote">Verifying your reset link...</p>
    </div>
    <form id="resetForm" style="display:none">
      <label>New password<input id="password" type="password" required minlength="6"></label>
      <label>Confirm password<input id="password2" type="password" required minlength="6"></label>
      <button>Save New Password</button>
    </form>
  </main>
  <div id="toast"></div>
  <script type="module" src="supabase-init.js"></script>
  <script defer src="reset-password.js"></script>
</body>
</html>
