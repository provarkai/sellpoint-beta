<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SellPoint Backend</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="single-page">
  <main>
    <header><div><h1>SellPoint Backend</h1><p class="meta">Developer/admin performance and payment control center</p></div><div class="top-actions"><button id="completeSetup">Complete Beta Setup</button><a class="button-link" href="index.html">Open App</a><a class="button-link" href="upgrade.html" target="_blank">Payment Page</a></div></header>
    <section class="metrics"><div><small>Total events</small><b id="devEvents">0</b></div><div><small>Digital revenue</small><b id="devDigitalRevenue">NGN 0</b></div><div><small>Setup</small><b id="devSetup">0%</b></div><div><small>Storage</small><b id="devStorage">0 KB</b></div></section>
    <section class="grid"><form id="ownerPaymentForm"><h2>SellPoint Payment Details</h2><label>Business/Account name<input id="ownerName" required placeholder="SellPoint Technologies"></label><label>Payment provider<select id="ownerProvider"><option>Manual bank transfer</option><option>Paystack</option><option>Flutterwave</option><option>Monnify</option></select></label><label>Payment link<input id="ownerLink" placeholder="https://paystack.shop/sellpoint"></label><label>Bank/payment details<textarea id="ownerDetails" rows="5" placeholder="Bank: Example Bank
Account: 1234567890
Name: SellPoint"></textarea></label><button>Save SellPoint Payment Details</button></form><article><h2>Beta Setup Checklist</h2><div id="checklist" class="checklist"></div></article></section>
    <section class="grid"><article><h2>Performance Monitor</h2><div id="devSummary" class="list"></div><p class="actions"><button id="copyReport">Copy Report</button><button id="exportAnalytics">Export Analytics</button></p></article><article><h2>Recent Activity</h2><div id="eventLog" class="list"></div></article></section>
  </main>
  <div id="toast"></div>
  <script src="backend.js"></script>
</body>
</html>
