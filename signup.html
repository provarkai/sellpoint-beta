<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up - SellersPoint</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="single-page premium-page">
  <main class="premium-main premium-auth">
    <div class="premium-hero">
      <span class="premium-kicker">SellersPoint</span>
      <h1>Create your account</h1>
      <p class="premium-sub">Free to start - 30 orders/month, upgrade any time.</p>
    </div>
    <form id="signupForm">
      <label>Business name<input id="businessName" required placeholder="Your Business"></label>
      <label>Phone number<input id="businessPhone" required placeholder="2348012345678"></label>
      <label>Email<input id="email" type="email" required></label>
      <label>Password<div class="pw-wrap"><input id="password" type="password" required minlength="6"><button type="button" class="pw-toggle" data-for="password">Show</button></div></label>
      <p class="meta">By creating an account you agree to our <a href="terms.html" target="_blank">Terms of Service</a> and <a href="privacy.html" target="_blank">Privacy Policy</a>.</p>
      <button>Create Account</button>
      <p class="meta">Already have an account? <a href="login.html">Log in</a></p>
    </form>
    <div class="auth-divider"><span>or continue with</span></div>
    <div class="oauth-buttons">
      <button type="button" class="oauth-btn" id="googleAuth">Continue with Google</button>
      <button type="button" class="oauth-btn" id="appleAuth">Continue with Apple</button>
    </div>
    <div id="phoneAuthBlock">
      <p class="actions"><button type="button" class="wizard-skip" id="showPhoneAuth">Continue with Phone Number instead</button></p>
      <form id="phoneForm" style="display:none">
        <label>Phone number<input id="phoneNumber" placeholder="2348012345678" required></label>
        <button>Send Code</button>
      </form>
      <form id="phoneOtpForm" style="display:none">
        <label>Enter the code sent to your phone<input id="phoneOtp" required placeholder="123456"></label>
        <button>Verify &amp; Continue</button>
      </form>
    </div>
    <p class="meta premium-hint">Just need a quick receipt? Try the <a href="receipt.html">free Receipt Generator</a> - no full setup required.</p>
  </main>
  <div id="toast"></div>
  <script type="module" src="supabase-init.js"></script>
  <script defer src="auth-shared.js"></script>
  <script defer src="signup.js"></script>
</body>
</html>
