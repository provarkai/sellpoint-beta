<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up - SellPoint</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="single-page payment-page">
  <main>
    <header><div><h1>Create your SellPoint account</h1><p class="meta">Free to start - 20 orders/month, upgrade any time.</p></div></header>
    <section class="grid">
      <form id="signupForm">
        <h2>Sign up</h2>
        <label>Business name<input id="businessName" required placeholder="Your Business"></label>
        <label>Email<input id="email" type="email" required></label>
        <label>Password<input id="password" type="password" required minlength="6"></label>
        <button>Create Account</button>
        <p class="meta">Already have an account? <a href="login.html">Log in</a></p>
      </form>
    </section>
  </main>
  <div id="toast"></div>
  <script type="module" src="supabase-init.js"></script>
  <script defer src="auth-shared.js"></script>
  <script defer src="signup.js"></script>
</body>
</html>
